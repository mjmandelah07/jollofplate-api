# Pings deployed API(s) every 10 minutes so Render free tier stays awake.
#
# Set repo variable KEEP_ALIVE_URL to one URL, or several comma-separated:
#   https://jollofplate-api.onrender.com
#   https://jollofplate-api.onrender.com,https://jollofplate-api-develop.onrender.com
#
# (KEEP_ALIVE_URLS also works as an alias.)
name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health on each API
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || secrets.KEEP_ALIVE_URL }}
          KEEP_ALIVE_URLS: ${{ vars.KEEP_ALIVE_URLS || secrets.KEEP_ALIVE_URLS }}
        run: |
          RAW="${KEEP_ALIVE_URLS:-$KEEP_ALIVE_URL}"
          if [ -z "$RAW" ]; then
            echo "Set KEEP_ALIVE_URL (or KEEP_ALIVE_URLS) as a repo variable."
            echo "Example: https://api-prod.onrender.com,https://api-dev.onrender.com"
            exit 1
          fi

          FAIL=0
          IFS=',' read -ra URLS <<< "$RAW"
          for url in "${URLS[@]}"; do
            BASE="$(echo "$url" | xargs)"
            BASE="${BASE%/}"
            if [ -z "$BASE" ]; then
              continue
            fi
            echo "GET ${BASE}/health"
            if curl -fsS --retry 2 --retry-delay 5 --max-time 30 "${BASE}/health"; then
              echo
              echo "OK ${BASE}"
            else
              echo
              echo "FAIL ${BASE}"
              FAIL=1
            fi
          done

          exit $FAIL
