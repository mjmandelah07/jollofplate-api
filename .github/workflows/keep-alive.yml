# Pings deployed service(s) every 10 minutes so Render free tier stays awake.
#
# Set repo variable KEEP_ALIVE_URL to one URL, or several comma-separated
# (API + web, prod + develop), e.g.:
#   https://jollofplate-api.onrender.com,https://jollofplate-web-develop.onrender.com
#
# Tries /health first, then falls back to / (so Next.js sites work without a health route).
# (KEEP_ALIVE_URLS also works as an alias.)
name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping each service
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || secrets.KEEP_ALIVE_URL }}
          KEEP_ALIVE_URLS: ${{ vars.KEEP_ALIVE_URLS || secrets.KEEP_ALIVE_URLS }}
        run: |
          RAW="${KEEP_ALIVE_URLS:-$KEEP_ALIVE_URL}"
          if [ -z "$RAW" ]; then
            echo "Set KEEP_ALIVE_URL (or KEEP_ALIVE_URLS) as a repo variable."
            echo "Example: https://api.onrender.com,https://web.onrender.com"
            exit 1
          fi

          FAIL=0
          IFS=',' read -ra URLS <<< "$RAW"
          for url in "${URLS[@]}"; do
            BASE="$(echo "$url" | xargs)"
            BASE="${BASE%/}"
            if [ -z "$BASE" ]; then
              continue
            fi

            ok=0
            for PATH_SUFFIX in /health /; do
              TARGET="${BASE}${PATH_SUFFIX}"
              echo "GET ${TARGET}"
              if curl -fsS --retry 2 --retry-delay 5 --max-time 45 "${TARGET}" >/dev/null; then
                echo "OK ${TARGET}"
                ok=1
                break
              fi
              echo "miss ${TARGET}"
            done

            if [ "$ok" -ne 1 ]; then
              echo "FAIL ${BASE}"
              FAIL=1
            fi
          done

          exit $FAIL
